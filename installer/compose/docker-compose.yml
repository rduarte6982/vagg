# Stack do VPN Aggregator (SPEC §3.1 / Fase 10).
#
# Serviços:
#   vagg-core  — API FastAPI (auth + CRUD + orchestrator)
#   vagg-ui    — SPA React servida por nginx, proxia /api → core
#   vagg-dns   — CoreDNS lendo /etc/coredns/Corefile gerado pelo core
#
# Tunnel containers NÃO ficam aqui — eles são criados dinamicamente pelo
# vagg-core via Docker API (network: host) quando um cliente conecta.

name: vagg

services:
  vagg-core:
    image: ${VAGG_REGISTRY:-ghcr.io/rduarte6982/vagg}/core:${VAGG_VERSION:-latest}
    restart: unless-stopped
    env_file: /etc/vagg/core.env
    network_mode: host        # § 4.3 — iptables/ip-route precisam do host net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Adiciona ao container o GID do grupo `docker` do host (988 no Ubuntu),
    # pra o user vagg (1000) conseguir abrir /var/run/docker.sock que é
    # rw para root:docker. Sem isso, todas as chamadas à Docker API falham
    # com "Permission denied" e o status fica como `errored` na UI.
    group_add:
      - "988"
    volumes:
      - /var/lib/vagg/db:/var/lib/vagg/db
      - /var/lib/vagg/clients:/var/lib/vagg/clients
      - /var/lib/vagg/sockets:/var/lib/vagg/sockets
      - /var/lib/vagg/dns-config:/var/lib/vagg/dns-config
      - /etc/iproute2/rt_tables:/etc/iproute2/rt_tables
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8443/api/v1/system/health',timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5

  vagg-dns:
    image: coredns/coredns:1.11.1
    restart: unless-stopped
    network_mode: host
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - /var/lib/vagg/dns-config:/etc/coredns:ro
    depends_on:
      - vagg-core

  vagg-ui:
    image: ${VAGG_REGISTRY:-ghcr.io/rduarte6982/vagg}/ui:${VAGG_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP plano (painel + api)
      - "443:443"   # HTTPS com self-signed cert (necessário pro /saml-portal/)
    # vagg-core roda em network_mode: host, então não é acessível via DNS do
    # compose. host-gateway dá ao container acesso ao loopback do host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Binários distribuíveis (instalador VAGG Client, etc) — exposto em
      # /downloads/ pelo nginx.
      - /var/lib/vagg/downloads:/var/www/downloads:ro
      # Self-signed cert pra TLS na porta 443 (necessário pro KasmVNC do
      # /saml-portal/ funcionar — WebCodecs/WebRTC exige secure context).
      # Gerar uma vez:
      #   sudo openssl req -x509 -newkey rsa:2048 -keyout /etc/vagg/tls/key.pem
      #     -out /etc/vagg/tls/cert.pem -days 3650 -nodes
      #     -subj "/CN=192.168.68.102"
      #     -addext "subjectAltName=IP:192.168.68.102"
      - /etc/vagg/tls:/etc/nginx/tls:ro
    depends_on:
      - vagg-core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Fase 11 — portal de transparência. Domínio público dedicado servido por
  # este container; o instalador adiciona um TLS terminator na frente
  # (recomendação: cloudflare ou caddy).
  vagg-portal:
    image: ${VAGG_REGISTRY:-ghcr.io/rduarte6982/vagg}/portal:${VAGG_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8444:80"
    depends_on:
      - vagg-core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
