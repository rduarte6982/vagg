[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vagg-license-server"
version = "0.1.0"
description = "License server for VPN Aggregator (Stripe + Ed25519 JWT)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "VPN Aggregator contributors" }]

# Compliance: todas as deps MIT / BSD / Apache 2.0 (SPEC §2.5).
# Postgres driver: asyncpg (Apache 2.0), NÃO psycopg (LGPL).
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "email-validator>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.30,<1.0",
    "stripe>=10.0,<13.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.4,<26.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "testcontainers[postgres]>=4.8,<5.0",
    "freezegun>=1.5,<2.0",
]

[project.scripts]
vagg-license-keypair = "vagg_license.scripts.generate_keypair:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vagg_license"]

# ----- Ruff (SPEC §2.2: linha 100, regras rigorosas) -----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # bandit (security)
    "ASYNC",# async issues
    "T20",  # no print
    "PT",   # pytest style
    "RET",  # return
    "SIM",  # simplify
    "TID",  # tidy imports
]
ignore = [
    "S101",  # asserts allowed in tests
    "B008",  # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # hardcoded test secrets, weak random in tests
"src/vagg_license/scripts/**" = ["T201"]  # CLI scripts may print

[tool.ruff.lint.isort]
known-first-party = ["vagg_license", "tests"]
combine-as-imports = true
force-sort-within-sections = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----- mypy --strict -----
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "freezegun.*"]
ignore_missing_imports = true

# ----- pytest -----
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker (Postgres testcontainer)",
]

[tool.coverage.run]
source = ["src/vagg_license"]
branch = true
omit = [
    # CLI utility — exercised manually by operators, not in pytest
    "src/vagg_license/scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
