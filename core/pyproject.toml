[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vagg-core"
version = "0.1.0"
description = "Aggregator core API for VPN Aggregator (FastAPI + SQLite + JWT)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "VPN Aggregator contributors" }]

# Compliance: SPEC §2.5 — todas MIT/BSD/Apache 2.0/MPL 2.0.
# DB: SQLite via aiosqlite (Apache 2.0). Hash: argon2-cffi (MIT).
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "email-validator>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.20,<1.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "python-multipart>=0.0.20,<1.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.4,<26.0",
    "aiodocker>=0.23,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "freezegun>=1.5,<2.0",
]

[project.scripts]
vagg-hash-password = "vagg_core.scripts.hash_password:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vagg_core"]

# ----- Ruff (SPEC §2.2: linha 100) -----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "S",
    "ASYNC", "T20", "PT", "RET", "SIM", "TID",
]
ignore = [
    "S101",  # asserts allowed
    "B008",  # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/vagg_core/scripts/**" = ["T201"]  # CLI scripts may print

[tool.ruff.lint.isort]
known-first-party = ["vagg_core", "tests"]
combine-as-imports = true
force-sort-within-sections = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----- mypy --strict -----
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["argon2.*", "freezegun.*", "aiodocker.*"]
ignore_missing_imports = true

# ----- pytest -----
[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires temporary SQLite DB (no Docker needed)",
]

[tool.coverage.run]
source = ["src/vagg_core"]
branch = true
omit = [
    "src/vagg_core/scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
