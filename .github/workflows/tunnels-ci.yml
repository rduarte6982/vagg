name: tunnels-ci

# CI dos componentes que rodam DENTRO dos containers de túnel:
#   - tunnels/shared: tunnel-controller stdlib-only (Python lint + tests)
#   - tunnels/<proto>: imagens Docker (build sem push) — matrix com os 5 protocolos
#     suportados a partir da Fase 5: openvpn, openconnect, openfortivpn,
#     wireguard, strongswan.

on:
  push:
    branches: [main]
    paths:
      - 'tunnels/**'
      - '.github/workflows/tunnels-ci.yml'
  pull_request:
    paths:
      - 'tunnels/**'
      - '.github/workflows/tunnels-ci.yml'

permissions:
  contents: read

concurrency:
  group: tunnels-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-lint-and-test:
    name: tunnels/shared (lint + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'tunnels/shared/pyproject.toml'

      - name: Install dev tools
        working-directory: tunnels/shared
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: tunnels/shared
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy --strict)
        working-directory: tunnels/shared
        run: mypy --strict tunnel_controller.py tests

      - name: Tests
        working-directory: tunnels/shared
        run: pytest -q

  build-images:
    name: tunnels/${{ matrix.protocol }} (build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - protocol: openvpn
            smoke: openvpn --version | head -1
          - protocol: openconnect
            smoke: openconnect --version | head -1
          - protocol: openfortivpn
            smoke: openfortivpn --version
          - protocol: wireguard
            smoke: wg --version
          - protocol: strongswan
            smoke: swanctl --version

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build vagg-tunnel-${{ matrix.protocol }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: tunnels
          file: tunnels/${{ matrix.protocol }}/Dockerfile
          push: false
          tags: vagg/tunnel-${{ matrix.protocol }}:ci
          load: true

      - name: Smoke test the image starts
        run: |
          # Confirm the controller + protocol binary are in place and python
          # can import asyncio. Real protocol-level testing requires lab VPN
          # servers and is done manually.
          docker run --rm --entrypoint /bin/sh \
              vagg/tunnel-${{ matrix.protocol }}:ci -c "
            test -x /usr/local/bin/tunnel-controller &&
            test -x /usr/local/bin/entrypoint &&
            python3 -c 'import asyncio, json; print(\"py-ok\")' &&
            ${{ matrix.smoke }}
          "
