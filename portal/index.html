<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de Transparência</title>
    <style>
      :root { font-family: system-ui, -apple-system, sans-serif; }
      body { margin: 0; background: #f7f7f9; color: #18181b; }
      a { color: #0369a1; }
      .container { max-width: 960px; margin: 0 auto; padding: 24px; }
      .card { background: #fff; border: 1px solid #e4e4e7; border-radius: 8px;
              padding: 16px; margin-bottom: 16px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 6px 8px; border-bottom: 1px solid #e4e4e7;
               text-align: left; font-size: 14px; }
      th { background: #f4f4f5; }
      input, button { font: inherit; padding: 6px 10px; border-radius: 4px;
                      border: 1px solid #d4d4d8; }
      button { background: #18181b; color: #fff; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      .muted { color: #71717a; font-size: 12px; }
      .err { color: #b91c1c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
