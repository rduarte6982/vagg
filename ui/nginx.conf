# nginx vhost da vagg-ui — serve o bundle Vite + proxia /api ao vagg-core.
#
# Dois listeners:
#   :80   HTTP plano (painel + downloads + api)
#   :443  HTTPS com self-signed cert montado em /etc/nginx/tls/{cert,key}.pem
#         — necessário pro /saml-portal/ porque KasmVNC usa WebCodecs/WebRTC
#         que só funcionam em secure context.

# Map pra preservar Upgrade/Connection ao proxar WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Bloco macro com todas as locations — usado nos dois listeners (80 e 443).
# Definido como variável shell-like via include não é viável em nginx; então
# duplicamos parcialmente, mantendo o mínimo. As partes críticas (downloads,
# /api/, /saml-portal/, SPA) ficam idênticas.

# ─────────────────────────────────────────────────────────────
# HTTP — porta 80
# ─────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /saml-portal/ exige HTTPS (KasmVNC com WebCodecs). Redireciona pro :443.
    location ^~ /saml-portal/ {
        return 301 https://$host$request_uri;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ^~ /downloads/ {
        alias /var/www/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
        sendfile on;
        tcp_nopush on;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# ─────────────────────────────────────────────────────────────
# HTTPS — porta 443 (self-signed cert montado pelo compose)
# ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # /saml-portal/ — KasmVNC + Firefox via reverse proxy. Crítico ter HTTPS
    # aqui pra Selkies/WebCodecs funcionar (secure context).
    location ^~ /saml-portal/ {
        proxy_pass http://host.docker.internal:14500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ^~ /downloads/ {
        alias /var/www/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
        sendfile on;
        tcp_nopush on;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
