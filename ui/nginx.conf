# nginx vhost da vagg-ui — serve o bundle Vite e proxia /api ao vagg-core.
#
# Em produção (Fase 10), o installer também coloca um TLS termination na frente,
# então este vhost roda em HTTP no localhost da VM aggregator.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hash-based assets do Vite — cache agressivo, são imutáveis.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Proxy ao vagg-core. A configuração real do upstream vem do compose
    # (link "vagg-core") ou do install.sh (network internal).
    location /api/ {
        proxy_pass http://vagg-core:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: tudo o que não for arquivo estático cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck do container.
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
